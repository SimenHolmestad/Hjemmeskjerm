<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <title>Hjemmeskjerm</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="screen">
      <div class="entur-tavla">
        <iframe
          src="%VITE_ENTUR_TAVLA_URL%"
          title="Avgangstavle fra Entur"
        ></iframe>
      </div>
      <div class="statusbar">
        <div class="netatmo">
          <div class="netatmo-item">
            <svg class="netatmo-icon" viewBox="0 0 22 32" aria-hidden="true">
              <path
                d="M11 4a3.5 3.5 0 0 1 3.5 3.5v11.2a6.5 6.5 0 1 1-7 0V7.5A3.5 3.5 0 0 1 11 4Z"
                fill="none"
                stroke="#111"
                stroke-width="2"
              />
              <path d="M11 10v11" stroke="#e0301e" stroke-width="3.5" stroke-linecap="round" />
              <circle cx="11" cy="24" r="4" fill="#e0301e" />
            </svg>
            <span class="netatmo-value"><span id="netatmo-temperature">–</span>°</span>
            <div class="netatmo-spark-wrap">
              <svg class="netatmo-spark" viewBox="0 0 88 40" aria-hidden="true">
                <path class="netatmo-spark-rule" id="netatmo-rule-temperature" />
                <path class="netatmo-spark-line" id="netatmo-spark-temperature" />
              </svg>
              <span class="netatmo-spark-label" id="netatmo-range-temperature-max">–</span>
              <span class="netatmo-spark-label" id="netatmo-range-temperature-min">–</span>
            </div>
          </div>
          <div class="netatmo-item">
            <svg class="netatmo-icon" viewBox="0 0 26 32" aria-hidden="true">
              <path d="M13 3C13 3 22 13.2 22 19.5a9 9 0 1 1-18 0C4 13.2 13 3 13 3Z" fill="#1f6fd0" />
            </svg>
            <span class="netatmo-value"><span id="netatmo-humidity">–</span>%</span>
            <div class="netatmo-spark-wrap">
              <svg class="netatmo-spark" viewBox="0 0 88 40" aria-hidden="true">
                <path class="netatmo-spark-rule" id="netatmo-rule-humidity" />
                <path class="netatmo-spark-line" id="netatmo-spark-humidity" />
              </svg>
              <span class="netatmo-spark-label" id="netatmo-range-humidity-max">–</span>
              <span class="netatmo-spark-label" id="netatmo-range-humidity-min">–</span>
            </div>
          </div>
          <div class="netatmo-item netatmo-item--co2">
            <svg class="netatmo-icon netatmo-icon--cloud" viewBox="0 0 40 32" aria-hidden="true">
              <g fill="#5e5e5e">
                <circle cx="17" cy="14" r="12" />
                <circle cx="30" cy="20.5" r="9" />
                <circle cx="9.5" cy="21.5" r="8.5" />
                <rect x="9.5" y="21.5" width="20.5" height="8.5" rx="4.25" />
              </g>
              <text x="19" y="24" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">
                CO<tspan font-size="10" dy="2">2</tspan>
              </text>
            </svg>
            <span class="netatmo-value"
              ><span id="netatmo-co2">–</span><span class="netatmo-unit">ppm</span></span
            >
            <div class="netatmo-spark-wrap">
              <svg class="netatmo-spark" viewBox="0 0 88 40" aria-hidden="true">
                <path class="netatmo-spark-rule" id="netatmo-rule-co2" />
                <path class="netatmo-spark-line" id="netatmo-spark-co2" />
              </svg>
              <span class="netatmo-spark-label" id="netatmo-range-co2-max">–</span>
              <span class="netatmo-spark-label" id="netatmo-range-co2-min">–</span>
            </div>
          </div>
        </div>
        <div class="toyenbadet">
          <svg class="toyenbadet-icon" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="22" fill="none" stroke="#e0301e" stroke-width="17" />
            <circle
              cx="32"
              cy="32"
              r="22"
              fill="none"
              stroke="#fff"
              stroke-width="17"
              stroke-dasharray="13.82 13.82"
              transform="rotate(-144 32 32)"
            />
            <circle cx="32" cy="32" r="30.5" fill="none" stroke="#111" stroke-width="3" />
            <circle cx="32" cy="32" r="13.5" fill="none" stroke="#111" stroke-width="3" />
          </svg>
          <span class="toyenbadet-now" id="toyenbadet-now">–</span>
          <span class="toyenbadet-flow">
            <span>inn:</span>
            <span id="toyenbadet-in">–</span>
            <span>ut:</span>
            <span id="toyenbadet-out">–</span>
          </span>
        </div>
      </div>
      <div class="yr">
        <iframe
          src="%VITE_YR_URL%"
          title="Meteogram fra Yr"
          scrolling="no"
        ></iframe>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
